<!doctype html>
<html lang=en>

<head>
  <meta charset=UTF-8>
  <meta name=viewport
    content="width=device-width,initial-scale=1">
  <meta
    http-equiv=Content-Security-Policy
    content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self' blob:;">
  <title>DocuMorph - PurplePDF</title>
  <meta name=description
    content="Advanced document extraction tool with AI-powered formatting - Convert PDF, DOCX, Excel to Markdown">
  <meta name=author content=PurplePDF>
  <link rel=icon type=image/svg+xml
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%238b5cf6'/%3E%3Cstop offset='50%25' stop-color='%23ec4899'/%3E%3Cstop offset='100%25' stop-color='%23f59e0b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='45' fill='url(%23g)'/%3E%3Cpath d='M35 35h30v8h-30zm0 12h25v6h-25zm0 10h28v6h-28z' fill='white' opacity='0.9'/%3E%3Cpath d='M40 65h20l-5-5v3h-10v4z' fill='white'/%3E%3C/svg%3E">
  <script
    src=https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js>
  </script>
  <script
    src=https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js>
  </script>
  <script
    src=https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js>
  </script>
  <script
    src=https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js>
  </script>
  <script
    src=https://cdnjs.cloudflare.com/ajax/libs/turndown/7.1.2/turndown.min.js>
  </script>
  <script
    src=https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js>
  </script>
  <link rel=stylesheet
    href=https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css>
  <link rel=stylesheet
    href=https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css>
  <script
    src=https://cdn.tailwindcss.com>
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }
    
    body {
      background: #000;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden
    }
    
    .gradient-text {
      background: linear-gradient(45deg, #8b5cf6, #ec4899, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% auto;
      animation: gradientShift 3s ease infinite
    }
    
    @keyframes gradientShift {
      
      0%,
      100% {
        background-position: 0 50%
      }
      
      50% {
        background-position: 100% 50%
      }
    }
    
    .upload-zone {
      border: 3px solid rgba(139, 92, 246, .5);
      border-radius: 12px;
      transition: all .3s cubic-bezier(.4, 0, .2, 1)
    }
    
    .upload-zone:hover {
      border-color: #8b5cf6;
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(139, 92, 246, .3)
    }
    
    .upload-zone.dragover {
      border-color: #ec4899;
      background: rgba(139, 92, 246, .1);
      transform: scale(1.05)
    }
    
    .upload-zone:focus-within {
      outline: 3px solid #8b5cf6;
      outline-offset: 2px
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border-radius: 8px;
      transition: all .3s cubic-bezier(.4, 0, .2, 1);
      cursor: pointer
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(139, 92, 246, .4)
    }
    
    .btn-primary:active {
      transform: translateY(0)
    }
    
    .btn-primary:focus {
      outline: 3px solid #ec4899;
      outline-offset: 2px
    }
    
    .progress-container {
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      height: 32px;
      position: relative;
      border: 1px solid rgba(139, 92, 246, .3)
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #8b5cf6, #ec4899, #f59e0b);
      transition: width .3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .875rem;
      font-weight: 600;
      color: #fff
    }
    
    .fade-in {
      animation: fadeIn .5s cubic-bezier(.4, 0, .2, 1)
    }
    
    .slide-up {
      animation: slideUp .6s cubic-bezier(.4, 0, .2, 1)
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0
      }
      
      to {
        opacity: 1
      }
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px)
      }
      
      to {
        opacity: 1;
        transform: translateY(0)
      }
    }
    
    .content-container {
      background: #0a0a0a;
      border: 1px solid rgba(139, 92, 246, .2);
      border-radius: 8px;
      max-height: 60vh;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #8b5cf6 #1a1a1a;
      position: relative
    }
    
    .content-container::-webkit-scrollbar {
      width: 8px
    }
    
    .content-container::-webkit-scrollbar-track {
      background: #1a1a1a;
      border-radius: 4px
    }
    
    .content-container::-webkit-scrollbar-thumb {
      background: #8b5cf6;
      border-radius: 4px
    }
    
    .content-container::-webkit-scrollbar-thumb:hover {
      background: #ec4899
    }
    
    .btn-toggle {
      transition: all .3s cubic-bezier(.4, 0, .2, 1);
      border: 2px solid rgba(139, 92, 246, .3);
      border-radius: 8px;
      cursor: pointer
    }
    
    .btn-toggle:hover {
      background: rgba(139, 92, 246, .2);
      border-color: #8b5cf6
    }
    
    .btn-toggle:focus {
      outline: 2px solid #8b5cf6;
      outline-offset: 2px
    }
    
    .btn-toggle.active {
      background: #8b5cf6;
      color: #000;
      border-color: #8b5cf6
    }
    
    .error-banner {
      background: linear-gradient(135deg, rgba(239, 68, 68, .2), rgba(220, 38, 38, .1));
      border: 2px solid rgba(239, 68, 68, .5);
      border-radius: 8px;
      padding: 1rem;
      margin: 1rem 0;
      animation: slideDown .3s ease
    }
    
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px)
      }
      
      to {
        opacity: 1;
        transform: translateY(0)
      }
    }
    
    .success-banner {
      background: linear-gradient(135deg, rgba(34, 197, 94, .2), rgba(22, 163, 74, .1));
      border: 2px solid rgba(34, 197, 94, .5);
      border-radius: 8px;
      padding: .75rem 1rem;
      animation: slideDown .3s ease;
      font-size: .875rem
    }
    
    .markdown-editor {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      font-size: .875rem;
      line-height: 1.6;
      padding: 1.5rem;
      border: none;
      outline: 0;
      resize: vertical;
      width: 100%;
      min-height: 400px;
      white-space: pre-wrap;
      word-wrap: break-word
    }
    
    .markdown-editor:focus {
      outline: 2px solid rgba(139, 92, 246, .5);
      outline-offset: -2px
    }
    
    .markdown-content {
      line-height: 1.8;
      white-space: pre-wrap;
      word-wrap: break-word
    }
    
    .markdown-content h1,
    .markdown-content h2,
    .markdown-content h3,
    .markdown-content h4,
    .markdown-content h5,
    .markdown-content h6 {
      color: #8b5cf6;
      font-weight: 700;
      line-height: 1.3;
      margin-top: 2rem;
      margin-bottom: 1rem;
      page-break-after: avoid
    }
    
    .markdown-content h1:first-child,
    .markdown-content h2:first-child,
    .markdown-content h3:first-child {
      margin-top: 0
    }
    
    .markdown-content h1 {
      font-size: 2.25rem;
      border-bottom: 3px solid rgba(139, 92, 246, .3);
      padding-bottom: .75rem;
      margin-bottom: 1.5rem
    }
    
    .markdown-content h2 {
      font-size: 1.875rem;
      margin-top: 2.5rem;
      padding-top: .5rem
    }
    
    .markdown-content h3 {
      font-size: 1.5rem;
      margin-top: 2rem
    }
    
    .markdown-content h4 {
      font-size: 1.25rem;
      margin-top: 1.5rem;
      color: #ec4899
    }
    
    .markdown-content h5 {
      font-size: 1.125rem;
      margin-top: 1.25rem;
      color: #ec4899
    }
    
    .markdown-content h6 {
      font-size: 1rem;
      margin-top: 1rem;
      color: #f59e0b
    }
    
    .markdown-content p {
      margin-bottom: 1.25rem;
      line-height: 1.8
    }
    
    .markdown-content ol,
    .markdown-content ul {
      margin-left: 0;
      padding-left: 2rem;
      margin-bottom: 1.25rem;
      margin-top: .5rem
    }
    
    .markdown-content ul {
      list-style-type: disc
    }
    
    .markdown-content ul ul {
      list-style-type: circle;
      margin-top: .5rem;
      margin-bottom: .5rem
    }
    
    .markdown-content ul ul ul {
      list-style-type: square
    }
    
    .markdown-content ol {
      list-style-type: decimal
    }
    
    .markdown-content ol ol {
      list-style-type: lower-alpha;
      margin-top: .5rem;
      margin-bottom: .5rem
    }
    
    .markdown-content ol ol ol {
      list-style-type: lower-roman
    }
    
    .markdown-content li {
      margin-bottom: .5rem;
      line-height: 1.7;
      padding-left: .5rem
    }
    
    .markdown-content li>p {
      margin-bottom: .5rem
    }
    
    .markdown-content li>ol,
    .markdown-content li>ul {
      margin-top: .5rem
    }
    
    .markdown-content strong {
      color: #ec4899;
      font-weight: 600
    }
    
    .markdown-content em {
      color: #c084fc;
      font-style: italic
    }
    
    .markdown-content code {
      background: rgba(139, 92, 246, .15);
      padding: .2rem .5rem;
      border-radius: 4px;
      color: #8b5cf6;
      font-family: 'Courier New', monospace;
      font-size: .9em
    }
    
    .markdown-content pre {
      background: #1a1a1a;
      padding: 1.5rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 1.5rem 0;
      border: 1px solid rgba(139, 92, 246, .2)
    }
    
    .markdown-content pre code {
      background: 0 0;
      padding: 0;
      color: #e0e0e0
    }
    
    .markdown-content blockquote {
      border-left: 4px solid #8b5cf6;
      padding: 1rem 1.5rem;
      margin: 1.5rem 0;
      font-style: italic;
      color: #ccc;
      background: rgba(139, 92, 246, .05);
      border-radius: 4px
    }
    
    .markdown-content a {
      color: #8b5cf6;
      text-decoration: underline;
      transition: color .2s
    }
    
    .markdown-content a:hover {
      color: #ec4899
    }
    
    .markdown-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      border: 1px solid rgba(139, 92, 246, .3);
      border-radius: 8px;
      overflow: hidden
    }
    
    .markdown-content td,
    .markdown-content th {
      border: 1px solid rgba(139, 92, 246, .3);
      padding: .75rem;
      text-align: left
    }
    
    .markdown-content th {
      background: rgba(139, 92, 246, .2);
      color: #8b5cf6;
      font-weight: 600
    }
    
    .markdown-content tr:nth-child(2n) {
      background: rgba(139, 92, 246, .05)
    }
    
    .markdown-content hr {
      border: none;
      border-top: 2px solid rgba(139, 92, 246, .3);
      margin: 2.5rem 0
    }
    
    .markdown-content img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 1.5rem 0
    }
    
    .stat-card {
      background: linear-gradient(135deg, rgba(139, 92, 246, .1), rgba(236, 72, 153, .1));
      border: 1px solid rgba(139, 92, 246, .3);
      border-radius: 8px;
      padding: 1rem;
      transition: all .3s cubic-bezier(.4, 0, .2, 1)
    }
    
    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(139, 92, 246, .2);
      border-color: #8b5cf6
    }
    
    .html-code {
      background: #0d1117;
      color: #c9d1d9;
      font-family: 'Courier New', monospace;
      font-size: .875rem;
      line-height: 1.6;
      padding: 1.5rem;
      border-radius: 8px;
      overflow-x: auto
    }
    
    .formatting-controls {
      display: flex;
      gap: .5rem;
      padding: .75rem;
      background: #1a1a1a;
      border-bottom: 1px solid rgba(139, 92, 246, .2);
      flex-wrap: wrap;
      align-items: center
    }
    
    .format-btn {
      background: rgba(139, 92, 246, .2);
      border: 1px solid rgba(139, 92, 246, .3);
      padding: .5rem .75rem;
      border-radius: 6px;
      font-size: .75rem;
      transition: all .2s;
      cursor: pointer;
      color: #fff
    }
    
    .format-btn:hover {
      background: rgba(139, 92, 246, .4);
      border-color: #8b5cf6
    }
    
    .format-btn.active {
      background: #8b5cf6;
      color: #000
    }
    
    .autosave-indicator {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .75rem;
      color: #888;
      margin-left: auto
    }
    
    .autosave-indicator.saving {
      color: #f59e0b
    }
    
    .autosave-indicator.saved {
      color: #22c55e
    }
    
    @media (max-width:768px) {
      .hide-text-mobile span {
        display: none
      }
      
      .hide-text-mobile {
        padding: .5rem 1rem !important
      }
      
      .stat-grid {
        grid-template-columns: repeat(2, 1fr) !important
      }
      
      .markdown-content h1 {
        font-size: 1.75rem
      }
      
      .markdown-content h2 {
        font-size: 1.5rem
      }
      
      .markdown-content h3 {
        font-size: 1.25rem
      }
      
      .formatting-controls {
        flex-wrap: wrap
      }
      
      .format-btn {
        padding: .4rem .6rem;
        font-size: .7rem
      }
    }
  </style>
</head>

<body class=min-h-screen>
  <header
    class="flex items-center justify-between border-b border-gray-700 pb-4 fade-in px-4 py-4">
    <div
      class="flex items-center space-x-3">
      <div
        class="w-10 h-10 bg-gradient-to-br from-purple-500 to-pink-500 rounded-lg flex items-center justify-center shadow-lg">
        <svg width=24 height=24
          viewBox="0 0 100 100"
          xmlns=http://www.w3.org/2000/svg>
          <defs>
            <linearGradient
              id=headerGrad x1=0% y1=0%
              x2=100% y2=100%>
              <stop offset=0%
                stop-color=#ffffff
                stop-opacity=0.9 />
              <stop offset=100%
                stop-color=#e5e7eb
                stop-opacity=0.8 />
            </linearGradient>
          </defs>
          <circle cx=50 cy=50 r=30
            fill=url(#headerGrad) />
          <path
            d="M40 42h20v4h-20zm0 6h16v3h-16zm0 5h18v3h-18z"
            fill=#8b5cf6 opacity=0.8 />
          <path
            d="M45 58h10l-3-2v1h-4v1z"
            fill=#8b5cf6 />
        </svg>
      </div>
      <h1
        class="text-2xl font-bold text-white">
        PurplePDF</h1>
    </div>
  </header>
  <main
    class="container mx-auto px-4 py-8 md:py-12">
    <div id=uploadSection class=fade-in>
      <div
        class="text-center mb-8 md:mb-12">
        <h2
          class="text-3xl md:text-5xl font-bold mb-3 md:mb-4 gradient-text">
          DocuMorph</h2>
        <p
          class="text-gray-400 text-base md:text-lg">
          Advanced extraction with
          powerful formatting algorithms
        </p>
      </div>
      <div class="max-w-2xl mx-auto">
        <div id=dropZone
          class="upload-zone p-8 md:p-12 text-center cursor-pointer bg-gradient-to-br from-black to-gray-900"
          tabindex=0 role=button
          aria-label="Drop files here or click to browse">
          <i
            class="fas fa-cloud-upload-alt text-5xl md:text-6xl mb-4 md:mb-6 gradient-text"></i>
          <h3
            class="text-xl md:text-2xl font-semibold mb-2 md:mb-3">
            Drop your document here</h3>
          <p
            class="text-gray-400 mb-4 md:mb-6 text-sm md:text-base">
            or click to browse</p><input
            type=file id=fileInput
            class=hidden
            aria-label="File upload input">
        </div>
        <div id=errorDisplay
          class="hidden error-banner"
          role=alert>
          <div
            class="flex items-start space-x-3">
            <i
              class="fas fa-exclamation-triangle text-red-400 text-xl mt-1"></i>
            <div class=flex-1>
              <h4
                class="text-red-400 font-semibold mb-1">
                Error</h4>
              <p id=errorMessage
                class="text-gray-300 text-sm">
              </p>
            </div><button
              id=dismissError
              class="text-gray-400 hover:text-white"
              aria-label="Dismiss error"><i
                class="fas fa-times"></i></button>
          </div>
        </div>
      </div>
    </div>
    <div id=processingSection
      class="hidden fade-in">
      <div
        class="max-w-2xl mx-auto text-center">
        <button id=extractBtn
          class="btn-primary px-6 md:px-8 py-3 md:py-4 text-base md:text-lg font-semibold mb-6 md:mb-8 shadow-lg"
          aria-label="Start document extraction"><i
            class="fas fa-magic mr-2 md:mr-3"></i>Start
          Extraction</button>
        <div id=loadingSection
          class=hidden>
          <div class=mb-4><i
              class="fas fa-cog text-5xl md:text-6xl gradient-text animate-spin"
              aria-hidden=true></i>
          </div>
          <h3
            class="text-xl md:text-2xl font-semibold mb-4">
            Processing Document...</h3>
          <div id=progressText
            class="text-sm text-gray-400 mb-2"
            role=status
            aria-live=polite>
            Initializing...</div>
          <div
            class="progress-container mb-4"
            role=progressbar
            aria-valuemin=0
            aria-valuemax=100
            aria-valuenow=0>
            <div id=progressBar
              class=progress-bar
              style=width:0%>0%</div>
          </div>
        </div>
      </div>
    </div>
    <div id=resultSection
      class="hidden slide-up">
      <div class="max-w-6xl mx-auto">
        <div
          class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-6 stat-grid">
          <div class=stat-card>
            <div
              class="text-xs md:text-sm text-gray-400 mb-1">
              Characters</div>
            <div
              class="text-xl md:text-2xl font-bold gradient-text"
              id=charCount>0</div>
          </div>
          <div class=stat-card>
            <div
              class="text-xs md:text-sm text-gray-400 mb-1">
              Words</div>
            <div
              class="text-xl md:text-2xl font-bold gradient-text"
              id=wordCount>0</div>
          </div>
          <div class=stat-card>
            <div
              class="text-xs md:text-sm text-gray-400 mb-1">
              Lines</div>
            <div
              class="text-xl md:text-2xl font-bold gradient-text"
              id=lineCount>0</div>
          </div>
          <div class=stat-card>
            <div
              class="text-xs md:text-sm text-gray-400 mb-1">
              Paragraphs</div>
            <div
              class="text-xl md:text-2xl font-bold gradient-text"
              id=paraCount>0</div>
          </div>
        </div>
        <div
          class="flex flex-wrap justify-between items-center gap-3 md:gap-4 mb-4">
          <h3
            class="text-lg md:text-xl font-bold">
            <i
              class="fas fa-file-alt mr-2"></i><span
              class="hidden md:inline">Formatted
              Document</span><span
              class=md:hidden>Result</span>
          </h3>
          <div class="flex gap-2"
            role=group
            aria-label="View mode toggle">
            <button id=rawBtn
              class="btn-toggle px-3 md:px-4 py-2 text-sm md:text-base font-semibold active hide-text-mobile"
              aria-label="Show editable markdown"
              aria-pressed=true><i
                class="fas fa-edit"></i><span
                class=ml-2>Edit</span></button><button
              id=renderedBtn
              class="btn-toggle px-3 md:px-4 py-2 text-sm md:text-base font-semibold hide-text-mobile"
              aria-label="Show rendered view"
              aria-pressed=false><i
                class="fas fa-eye"></i><span
                class=ml-2>Preview</span></button><button
              id=htmlBtn
              class="btn-toggle px-3 md:px-4 py-2 text-sm md:text-base font-semibold hide-text-mobile"
              aria-label="Show HTML code"
              aria-pressed=false><i
                class="fab fa-html5"></i><span
                class=ml-2>HTML</span></button>
          </div>
        </div>
        <div id=autosaveNotification
          class="hidden success-banner mb-4">
          <div
            class="flex items-center space-x-2">
            <i
              class="fas fa-check-circle text-green-400"></i><span
              class=text-green-300>Changes
              auto-saved</span>
          </div>
