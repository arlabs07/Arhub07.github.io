  <script>

                'renameCancel'),

              .getElementById(
                'renameSave') };
        
        function initEventListeners() { elements
            .uploadBtn
            .addEventListener('click',
              () => elements.fileInput
              .click());
          elements.fileInput
            .addEventListener(
              'change', handleFiles);
          elements.dropZone
            .addEventListener('click',
              () => elements.fileInput
              .click());
          elements.dropZone
            .addEventListener(
              'dragover', e => { e
                  .preventDefault();
                elements.dropZone
                  .classList.add(
                    'drag-over') });
          elements.dropZone
            .addEventListener(
              'dragleave', e => { if (
                  !elements.dropZone
                  .contains(e
                    .relatedTarget))
                  elements.dropZone
                  .classList.remove(
                    'drag-over') });

            .addEventListener('drop',
              e => { e
                .preventDefault();
                elements.dropZone
                  .classList.remove(
                    'drag-over');
                handleFiles
              ({ target: { files: e
                      .dataTransfer
                      .files } }) });
          elements.mergeBtn
            .addEventListener('click',
              mergePDFs);
          elements.closePreview
            .addEventListener('click',
              () => hideOverlay(
                elements
                .previewOverlay));
          elements.passwordCancel
            .addEventListener('click',
              () => hideOverlay(
                elements
                .passwordOverlay));

            .addEventListener('click',

          elements.passwordInput
            .addEventListener(

          elements.renameInput
            .addEventListener(
              'keypress', e => e
              .key === 'Enter' &&
              handleRenameSave());
          document.addEventListener(
            'click', e => { if (!
                elements.contextMenu
                .contains(e.target))

                .mergedMenu
                .contains(e.target))
                hideMenu(elements
                  .mergedMenu) });

            'keydown', e => e
            .key === 'Escape' &&
            hideAllOverlays()) }
        
        function showOverlay(
        overlay) { overlay.style
            .display = 'block';

            overlay.classList.add(
              'show')) }
        
        function hideOverlay(
        overlay) { overlay.classList
            .remove('show');
          setTimeout(() => overlay
            .style.display = 'none',
            300) }
        
        function showMenu(menu) { menu
            .classList.remove(
              'hidden');
          requestAnimationFrame(() =>
            menu.classList.add(
              'show')) }
        
        function hideMenu(menu) { menu
            .classList.remove('show');
          setTimeout(() => menu
            .classList.add(
            'hidden'), 200) }
        
        function hideAllOverlays() { document
            .querySelectorAll(
              '.overlay').forEach(
              hideOverlay);
          hideMenu(elements
            .contextMenu);
          hideMenu(elements
            .mergedMenu) } async function handleFiles(
            e) { if (isProcessing)
              return; const newFiles =
              Array.from(e.target
                .files).filter(f => f
                .type ===
                'application/pdf'
                ); if (newFiles
              .length === 0) return;
            isProcessing = true; for (
              let i = 0; i < newFiles
              .length; i++) { const
                file = newFiles[
                i]; const
              fileObj = { file,
                preview: null,
                id: Date.now() +
                  Math.random() + i,
                customName: file
                  .name,
                isLoading: true };

              renderFileList
            (); try { setTimeout(
                async () => { const
                      preview =
                      await generatePreview(

                    fileObj
                      .preview =
                      preview;
                    fileObj
                      .isLoading =
                      false;
                    renderFileList
                      () }, i *
                  200) } catch (
              error) { console.error(
                  'Error generating preview:',
                  error);
                fileObj.isLoading =
                  false;
                renderFileList
              () } } updateMergeButton
              ();
            isProcessing =
            false } async function generatePreview(
            file, password = ''
            ) { const cacheKey =
              `${file.name}_${file.size}_${password}`; if (
              previewCache.has(
                cacheKey))
            return previewCache
              .get(
              cacheKey); return new Promise(
                async resolve => { try { const
                      arrayBuffer =
                      await file
                      .arrayBuffer(); const
                      loadingTask =
                      pdfjsLib
                      .getDocument({ data: arrayBuffer,
                        password }); const
                      pdf =
                      await loadingTask
                      .promise; const
                      page =
                      await pdf
                      .getPage(
                      1); const
                      scale =
                      0.4; const
                      viewport =
                      page
                      .getViewport({ scale }); const
                      canvas =
                      document
                      .createElement(
                        'canvas'
                        ); const
                      context =
                      canvas
                      .getContext(
                        '2d');
                    canvas
                      .height =
                      viewport
                      .height;
                    canvas.width =
                      viewport
                      .width; const
                      renderContext = { canvasContext: context,
                        viewport: viewport };
                    await page
                      .render(
                        renderContext
                        )
                      .promise; const
                      dataURL =
                      canvas
                      .toDataURL(
                        'image/jpeg',
                        0.8);
                    previewCache
                      .set(
                        cacheKey,
                        dataURL);
                    resolve(
                      dataURL
                      ) } catch (
                    error) { if (
                      error
                      .name ===
                      'PasswordException'
                      ) { showOverlay
                        (elements
                          .passwordOverlay
                          );
                      elements
                        .passwordInput
                        .focus();
                      elements
                        .passwordSubmit
                        .onclick =
                        async () => { const
                            password =
                            elements
                            .passwordInput
                            .value;
                          hideOverlay
                            (elements
                              .passwordOverlay
                              ); const
                            preview =
                            await generatePreview(
                              file,
                              password
                              ); const
                            fileIndex =
                            files
                            .findIndex(
                              f =>
                              f
                              .file ===
                              file
                              ); if (
                            fileIndex !==
                            -1
                            ) { files
                              [
                                fileIndex]
                              .preview =
                              preview;
                            files
                              [
                                fileIndex]
                              .password =
                              password;
                            files
                              [
                                fileIndex]
                              .isLoading =
                              false;
                            renderFileList
                              () } }; return } const
                      canvas =
                      document
                      .createElement(
                        'canvas'
                        ); const
                      ctx = canvas
                      .getContext(
                        '2d');
                    canvas.width =
                      100;
                    canvas
                      .height =
                      130;
                    ctx
                      .fillStyle =
                      '#374151';
                    ctx.fillRect(
                      0, 0, 100,
                      130);
                    ctx
                      .fillStyle =
                      '#9CA3AF';
                    ctx.font =
                      '12px sans-serif';

                      .textAlign =

                      .toDataURL()

            ''; if (files.length ===

        window.previewFile =

                        await pdf

                        canvas =
                        document

                        canvas

                      canvas

                        renderContext = { canvasContext: context,

                      error

                  i * 300) } if (pdf

              error) { elements
                .previewContent

                `<div class="text-center text-red-600 py-8"><i class="fas fa-exclamation-triangle text-3xl mb-4"></i><p>Error: ${error.message}</p></div>` } hideMenu
              (elements
              .contextMenu) };
        window.moveFileUp =
      function() { if (
            currentFileIndex > 0) {
            [files[
              currentFileIndex],
              files[
                currentFileIndex - 1

              currentFileIndex]];

          () } hideMenu(elements
            .contextMenu) };
        window.moveFileDown =
          function() { if (
              currentFileIndex < files

              [files[
                currentFileIndex],
                files[
                  currentFileIndex + 1

                currentFileIndex + 1
                ], files[
                currentFileIndex]];
              renderFileList
            () } hideMenu(elements
              .contextMenu) };
        window.renameFile =
      function() { if (
            currentFileIndex !== -1

              currentFileIndex; const
              currentName = files[
                currentFileIndex]
              .customName; const
              nameWithoutExt =
              currentName.replace(

              nameWithoutExt;

              .renameOverlay);
            elements.renameInput
              .focus() } hideMenu(
            elements.contextMenu) };
        window.renameMergedFile =
          function() { renameFileIndex
              = -2; const
              nameWithoutExt =
              mergedFileName.replace(
                /\.pdf$/i, '');
            elements.renameInput
              .value = nameWithoutExt;
            showOverlay(elements
              .renameOverlay);
            elements.renameInput
              .focus();
            hideMenu(elements
              .mergedMenu) };
        
        function handleRenameSave() { const
            newName = elements
            .renameInput.value
          .trim(); if (!newName)
            return; const finalName =
            newName.endsWith('.pdf') ?
            newName : newName +
            '.pdf'; if (
            renameFileIndex === -2
            ) { mergedFileName =
              finalName;
            showMergedFile
          () } else if (
            renameFileIndex !== -1
            ) { files[renameFileIndex]
              .customName = finalName;
            renderFileList
          () } hideOverlay(elements
            .renameOverlay);
          renameFileIndex = -
          1 } window.deleteFile =
          function() { if (
              currentFileIndex !== -1
              ) { files.splice(
                currentFileIndex, 1);
              renderFileList();
              updateMergeButton
            () } hideMenu(elements
              .contextMenu) };
        window.downloadFile =
          function() { if (
              currentFileIndex !== -1
              ) { const fileObj =
                files[
                  currentFileIndex]; const
                url = URL
                .createObjectURL(
                  fileObj.file); const
                a = document
                .createElement('a');
              a.href = url;
              a.download = fileObj
                .customName;
              document.body
                .appendChild(a);
              a.click();
              document.body
                .removeChild(a);
              URL.revokeObjectURL(
              url) } hideMenu(elements
              .contextMenu) };
        
        function updateMergeButton() { files
            .length >= 1 ? elements
            .mergeBtn.classList
            .remove('hidden') :
            elements.mergeBtn
            .classList.add(
            'hidden') } async function handlePasswordSubmit() { const
              password = elements
              .passwordInput.value;
            hideOverlay(elements
              .passwordOverlay
              ) } async function mergePDFs() { if (
                files.length < 1 ||
                isProcessing) return;
              isProcessing = true;
              elements
                .loadingContainer
                .classList.remove(
                  'hidden');
              elements.mergeBtn
                .disabled =
                true; try { const
                  mergedPdf =
                  await PDFLib
                  .PDFDocument
                  .create(); let
                  progress = 0; const
                  totalFiles = files
                  .length; for (let
                    i = 0; i < files
                  .length; i++
                  ) { const fileObj =
                    files[i]; const
                    arrayBuffer =
                    await fileObj.file
                    .arrayBuffer(); const
                    pdf = await PDFLib
                    .PDFDocument.load(
                      arrayBuffer, { password: fileObj
                          .password ||
                          undefined }
                      ); const
                    copiedPages =
                    await mergedPdf
                    .copyPages(pdf,
                      pdf
                      .getPageIndices()
                      );
                  copiedPages.forEach(
                    page =>
                    mergedPdf
                    .addPage(page));
                  progress = ((i +
                      1) / totalFiles
                      ) * 100;
                  elements.loadingBar
                    .style.width =
                    progress + '%';
                  elements
                    .loadingProgress
                    .textContent =
                    Math.round(
                      progress) + '%';
                  await new Promise(
                    resolve =>
                    setTimeout(
                      resolve, 100)
                    ) } const pdfBytes =
                  await mergedPdf
                  .save();
                mergedPdfBlob =
                  new Blob([
                  pdfBytes], { type: 'application/pdf' });
                showMergedFile
              () } catch (
              error) { alert(
                  'Error merging PDFs: ' +
                  error.message
                  ) } finally { elements
                  .loadingContainer
                  .classList.add(
                    'hidden');
                elements.mergeBtn
                  .disabled = false;
                isProcessing =
                false } }
        
        function showMergedFile() { const
            truncatedName =
            mergedFileName.length >
            25 ? mergedFileName
            .substring(0, 25) +
            '...' :
            mergedFileName; const
            fileItem = document
            .createElement('div');
          fileItem.className =
            'bg-green-800 rounded-lg p-4 flex items-center justify-between border-2 border-green-500 mb-4 fade-in shadow-lg';
          fileItem.innerHTML =
            `<div class="flex items-center space-x-4"><div class="text-green-400 text-lg font-bold"><i class="fas fa-check-circle"></i></div><div class="w-12 h-16 bg-green-600 rounded flex items-center justify-center shadow-sm"><i class="fas fa-file-pdf text-white"></i></div><div class="flex-1"><h4 class="font-semibold text-white truncate-name" title="${mergedFileName}">${truncatedName}</h4><p class="text-sm text-green-300">${(mergedPdfBlob.size/1024/1024).toFixed(2)} MB • Merged Successfully</p></div></div><button class="text-gray-300 hover:text-white p-2 relative transition-colors" onclick="showMergedMenu(event)"><i class="fas fa-ellipsis-v"></i></button>`;
          elements.fileList
            .insertBefore(fileItem,
              elements.fileList
              .firstChild) } window
          .previewMergedFile =
          async function() { try { elements
                  .previewContent
                  .innerHTML =
                  '<div class="text-center text-gray-600 py-8"><i class="fas fa-spinner fa-spin text-3xl mb-4 text-purple-500"></i><p>Loading merged preview...</p></div>';
                showOverlay(elements
                  .previewOverlay
                  ); const arrayBuffer =
                  await mergedPdfBlob
                  .arrayBuffer(); const
                  loadingTask =
                  pdfjsLib
                  .getDocument({ data: arrayBuffer }); const
                  pdf =
                  await loadingTask
                  .promise;
                elements
                  .previewContent
                  .innerHTML =
                  `<h3 class="text-xl font-bold mb-4 text-gray-800 text-center">${mergedFileName}</h3><div id="mergedPageContainer"></div>`; const
                  pageContainer =
                  document
                  .getElementById(
                    'mergedPageContainer'
                    ); const
                  maxPages = Math.min(
                    pdf.numPages, 6
                    ); for (let i =
                  1; i <=
                  maxPages; i++
                  ) { const pageDiv =
                    document
                    .createElement(
                      'div');
                  pageDiv.className =
                    'mb-4 text-center';
                  pageDiv.innerHTML =
                    '<div class="inline-block bg-gray-200 rounded p-4 shimmer"><div class="w-32 h-40"></div></div>';
                  pageContainer
                    .appendChild(
                      pageDiv);

                async () => { try { const
                          page =
                          await pdf
                          .getPage(
                            i

                          scale =
                          1.1; const
                          viewport =
                          page
                          .getViewport({ scale }); const
                          canvas =
                          document
                          .createElement(
                            'canvas'
                            ); const
                          context =
                          canvas
                          .getContext(
                            '2d');
                        canvas
                          .height =
                          viewport
                          .height;
                        canvas
                          .width =
                          viewport
                          .width;

                          .className =
                          'mb-2 border rounded shadow-lg max-w-full h-auto'; const
                          renderContext = { canvasContext: context,

                  pageContainer

                      moreDiv

                error) { elements

                (elements
                .mergedMenu) };
        window.downloadMergedFile =

        initEventListeners() });
  </script>
