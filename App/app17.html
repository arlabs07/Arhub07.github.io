<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arai - AI Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/htmlbars.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.js"></script>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #1f1f1f, #121212);
            color: #E8EAED;
        }

        .font-google-sans {
            font-family: 'Google Sans', sans-serif;
        }

        .main-container {
            background: transparent;
        }

        .bottom-bar {
            background: transparent;
            padding: 1rem;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 50;
        }

        @media (min-width: 768px) {
            .bottom-bar {
                max-width: 85%;
                margin: 0 auto;
            }
        }

        .bottom-bar-hidden {
            display: none;
        }

        .floating-input-container {
            background: #1E1F20;
            border: 1px solid #3C4043;
            border-radius: 12px;
            padding: .5rem;
        }

        .floating-input-container:focus-within {
            border-color: #8AB4F8;
        }

        .floating-input {
            background: transparent;
            color: #E8EAED;
            border: none;
            outline: none;
            resize: none;
        }

        .floating-input::placeholder {
            color: #969BA1;
        }

        .suggestion-chip {
            background: linear-gradient(135deg, #1E1F20, #2A2B2C);
            border: 1px solid #3C4043;
        }

        .horizontal-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .horizontal-scroll::-webkit-scrollbar {
            display: none;
        }

        @keyframes shimmer {
            0% {
                background-position: -1000px 0
            }
            100% {
                background-position: 1000px 0
            }
        }

        .shimmer {
            animation: shimmer 2s infinite linear;
            background: linear-gradient(to right, #1E1F20 4%, #343536 25%, #1E1F20 36%);
            background-size: 1000px 100%;
        }

        .result-source-card {
            background: #1E1F20;
            border: 1px solid #3C4043;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px)
            }
            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateY(0)
            }
            to {
                opacity: 0;
                transform: translateY(-10px)
            }
        }

        .fade-in {
            animation: fadeIn 1s ease-out;
        }

        .fade-out {
            animation: fadeOut .3s ease-out;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
        }

        .truncate-3-lines {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .action-btn {
            transition: all .2s ease;
        }

        .action-btn:hover {
            background: #3C4043;
            transform: scale(1.05);
        }

        .history-item {
            transition: all .2s ease;
        }

        .history-item:hover {
            background: #1E1F20;
        }

        .tts-active {
            color: #8AB4F8 !important;
            animation: pulse 1.5s infinite;
        }

        .news-item {
            background: #1E1F20;
            border: 1px solid #3C4043;
        }

        .recording {
            animation: pulse 1.5s infinite;
            color: #ff4444 !important;
        }

        @keyframes pulse {
            0% {
                transform: scale(1)
            }
            50% {
                transform: scale(1.1)
            }
            100% {
                transform: scale(1)
            }
        }

        .transition-all {
            transition: all .3s ease;
        }

        .attachment-preview {
            max-height: 100px;
            object-fit: cover;
        }

        .attachment-container {
            max-width: 150px;
            position: relative;
        }

        .remove-attachment {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff4444;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #8AB4F8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        .loading-progress {
            text-align: center;
            color: #E8EAED;
            margin-top: 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg)
            }
            100% {
                transform: rotate(360deg)
            }
        }

        .rotating {
            animation: spin 2s linear infinite;
        }

        .profile-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 24px;
            background: #1E1F20;
            border-radius: 16px;
            border: 1px solid #3C4043;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
        }

        .profile-header {
            font-size: 1.75rem;
            font-weight: 600;
            color: #E8EAED;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .profile-label {
            display: block;
            color: #E8EAED;
            font-weight: 500;
            margin-bottom: .5rem;
            font-size: .9rem;
        }

        .profile-input {
            width: 100%;
            padding: .75rem;
            background: #2A2B2C;
            border: 1px solid #3C4043;
            border-radius: 8px;
            color: #E8EAED;
            font-size: 1rem;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .profile-input:focus {
            border-color: #8AB4F8;
            box-shadow: 0 0 0 3px rgba(138, 180, 248, 0.2);
        }

        .profile-picture-container {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            justify-content: center;
        }

        .profile-picture-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #8AB4F8;
            box-shadow: 0 0 10px rgba(138, 180, 248, 0.3);
        }

        .profile-upload-label {
            display: inline-block;
            padding: .5rem 1rem;
            background: #3C4043;
            color: #E8EAED;
            border-radius: 8px;
            cursor: pointer;
            font-size: .9rem;
        }

        .profile-upload-label:hover {
            background: #4A4E54;
        }

        .profile-section {
            margin-bottom: 2rem;
        }

        .profile-icon-container {
            display: flex;
            align-items: center;
        }

        .profile-icon {
            clip-path: circle(50% at 50% 50%);
        }

        #profile-upload {
            display: none;
        }

        .code-container {
            position: relative;
        }

        .copy-code-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 8px;
            background: #3C4043;
            color: #E8EAED;
            border-radius: 4px;
            font-size: .8rem;
            cursor: pointer;
        }

        .copy-code-btn:hover {
            background: #8AB4F8;
            color: #000;
        }

        .multimedia-item {
            background: #1E1F20;
            border: 1px solid #3C4043;
            padding: 1rem;
            border-radius: 8px;
        }

        .multimedia-item:hover {
            background: #2A2B2C;
        }

        .notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1E1F20;
            border: 1px solid #3C4043;
            color: #E8EAED;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            opacity: 0;
            animation: notify 3s ease-in-out
        }

        @keyframes notify {
            0% {
                opacity: 0;
                transform: translate(-50%, 20px)
            }
            10% {
                opacity: 1;
                transform: translate(-50%, 0)
            }
            90% {
                opacity: 1;
                transform: translate(-50%, 0)
            }
            100% {
                opacity: 0;
                transform: translate(-50%, 20px)
            }
        }

        .media-player-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            background: #1E1F20;
            border-radius: 8px;
            padding: 1rem;
        }

        .media-player-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: .5rem;
            background: #2A2B2C;
            border-radius: 0 0 8px 8px;
        }

        .media-play-btn,
        .media-pause-btn,
        .media-seek-btn {
            font-size: 1.2rem;
            color: #E8EAED;
            cursor: pointer;
        }

        .media-seek-bar {
            width: 100%;
            margin: 0 1rem;
        }

        .media-time {
            font-size: .9rem;
            color: #E8EAED;
        }

        .ocr-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .ocr-spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #8AB4F8;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite, scalePulse 1.5s ease-in-out infinite;
        }

        .ocr-progress {
            font-size: 1.2rem;
            color: #E8EAED;
            margin-top: 20px;
            text-shadow: 0 0 10px rgba(138, 180, 248, 0.5);
            animation: fadePulse 1.5s ease-in-out infinite;
        }

        @keyframes scalePulse {
            0% {
                transform: scale(1)
            }
            50% {
                transform: scale(1.2)
            }
            100% {
                transform: scale(1)
            }
        }

        @keyframes fadePulse {
            0% {
                opacity: 0.7
            }
            50% {
                opacity: 1
            }
            100% {
                opacity: 0.7
            }
        }

        .table-responsive {
            max-width: 100%;
            overflow-x: auto;
        }

        .table-responsive table {
            border-collapse: collapse;
            border: 1px solid #3C4043;
        }

        .table-responsive th,
        .table-responsive td {
            padding: 8px;
            border: 1px solid #3C4043;
        }

        .fast-mode-btn {
            display: flex;
            align-items: center;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            cursor: pointer;
            font-weight: 500;
            color: white;
            position: relative;
            overflow: hidden;
            border: 1px solid #3C4043;
            background-color: #3c4043;
            transition: all 0.3s ease;
        }

        .fast-mode-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .fast-mode-btn:hover::before {
            left: 100%;
        }

        .fast-mode-btn:hover {
            background-color: #4a4e54;
        }
    </style>
</head>

<body class="antialiased">
    <div id="app-container" class="main-container max-w-4xl mx-auto h-screen flex flex-col">
        <div id="home-view" class="flex flex-col h-full">
            <header class="flex items-center justify-between p-4">
                <div class="profile-icon-container w-6">
                    <img id="profile-icon" src="" alt="Profile" class="profile-icon h-8 w-8 cursor-pointer object-cover" onclick="showProfile()">
                </div>
                <img id="logo" src="https://arlabs07.github.io/Arhub07.github.io/Images/Arai.png" alt="Arai Logo" class="h-8 w-8">
                <i class="fas fa-history text-xl text-gray-400 cursor-pointer" onclick="showHistory()"></i>
            </header>
            <main class="flex-grow flex flex-col pb-48">
                <div id="hello-message" class="text-center mb-4">
                    <h1 class="text-2xl text-gray-200"></h1>
                </div>
                <div class="flex-grow"></div>
            </main>
        </div>
        <div id="results-view" class="hidden flex-col h-full">
            <header class="flex items-center justify-between p-4 space-x-4 sticky top-0 bg-[#131314] z-10 border-b border-gray-800">
                <img id="results-logo" src="https://arlabs07.github.io/Arhub07.github.io/Images/Arai.png" alt="Arai Logo" class="h-6 w-6 flex-shrink-0">
                <div class="flex-grow text-lg text-gray-200 truncate" id="results-query-display"></div>
                <i class="fas fa-edit text-lg text-gray-400 cursor-pointer" onclick="resetChat()"></i>
                <i class="fas fa-history text-xl text-gray-400 cursor-pointer" onclick="showHistory()"></i>
            </header>
            <main id="results-content" class="flex-grow overflow-y-auto px-4 pt-6 pb-48">
                <div id="loading-skeleton" class="hidden space-y-4"></div>
                <div id="results-container"></div>
                <div id="action-buttons" class="hidden flex items-center space-x-4 mt-6 pt-4 border-t border-gray-700">
                    <button class="action-btn p-2 rounded-full" onclick="shareResponse()" title="Share"><i class="fas fa-share text-gray-400"></i></button>
                    <button class="action-btn p-2 rounded-full" onclick="copyResponse()" title="Copy"><i class="fas fa-copy text-gray-400"></i></button>
                    <button class="action-btn p-2 rounded-full" onclick="toggleTTS()" title="Text to Speech"><i class="fas fa-volume-up text-gray-400" id="tts-icon"></i></button>
                </div>
            </main>
        </div>
        <div id="history-view" class="hidden flex-col h-full">
            <header class="flex items-center justify-between p-4 space-x-4 sticky top-0 bg-[#131314] z-10 border-b border-gray-800">
                <i class="fas fa-arrow-left text-xl text-gray-400 cursor-pointer" onclick="goBack()"></i>
                <div class="flex-grow text-lg text-gray-200">Search History</div>
                <button class="text-red-400 text-sm" onclick="clearHistory()">Delete All</button>
            </header>
            <div class="p-4">
                <div class="floating-input-container flex items-center p-2 rounded-full w-full mb-4">
                    <i class="fas fa-search text-gray-400 px-2"></i>
                    <input type="text" id="history-search" class="floating-input w-full px-2 text-base" placeholder="Search history...">
                </div>
            </div>
            <main id="history-content" class="flex-grow overflow-y-auto px-4 pb-4">
                <div id="history-list"></div>
            </main>
        </div>
        <div id="profile-view" class="hidden flex-col h-full">
            <header class="flex items-center justify-between p-4 space-x-4 sticky top-0 bg-[#131314] z-10 border-b border-gray-800">
                <i class="fas fa-arrow-left text-xl text-gray-400 cursor-pointer" onclick="goBack()"></i>
                <div class="flex-grow text-lg text-gray-200 font-google-sans">Profile</div>
            </header>
            <main class="flex-grow overflow-y-auto px-4 pt-6 pb-24">
                <div class="max-w-4xl mx-auto">
                    <h2 class="text-2xl font-google-sans text-gray-200 mb-6">Your Profile</h2>
                    <div class="space-y-6">
                        <div class="flex items-center gap-4">
                            <img id="profile-picture-preview" src="" alt="Profile Preview" class="w-16 h-16 rounded-full object-cover border-2 border-[#8AB4F8]">
                            <div class="flex-1">
                                <label class="text-sm text-gray-300 mb-2 block">Profile Picture URL</label>
                                <input type="text" id="profile-url-input" class="w-full p-3 bg-[#1E1F20] border border-[#3C4043] rounded-xl text-gray-200 focus:border-[#8AB4F8] focus:ring-2 focus:ring-[#8AB4F8] outline-none transition-all" placeholder="Enter image URL">
                            </div>
                        </div>
                        <div>
                            <label class="profile-upload-label"><i class="fas fa-upload mr-2"></i>Upload Picture</label>
                            <input type="file" id="profile-upload" accept="image/*" class="hidden">
                        </div>
                        <div>
                            <label class="text-sm text-gray-300 mb-2 block">Username</label>
                            <input type="text" id="username-input" class="w-full p-3 bg-[#1E1F20] border border-[#3C4043] rounded-xl text-gray-200 focus:border-[#8AB4F8] focus:ring-2 focus:ring-[#8AB4F8] outline-none transition-all" placeholder="Enter your username">
                        </div>
                        <div>
                            <label class="text-sm text-gray-300 mb-2 block">Translation Language (default for no translation)</label>
                            <input type="text" id="translation-lang" class="w-full p-3 bg-[#1E1F20] border border-[#3C4043] rounded-xl text-gray-200 focus:border-[#8AB4F8] focus:ring-2 focus:ring-[#8AB4F8] outline-none transition-all" placeholder="Enter language code (e.g., en, hi, es)" value="default">
                        </div>
                        <button onclick="saveProfile()" class="w-full py-3 bg-[#8AB4F8] rounded-2xl text-black font-medium hover:bg-[#6B9CF6] transition-all">Save</button>
                    </div>
                </div>
            </main>
        </div>
        <div id="camera-view" class="hidden flex-col h-full">
            <header class="flex items-center justify-between p-4 space-x-4 sticky top-0 bg-[#131314] z-10 border-b border-gray-800">
                <i class="fas fa-arrow-left text-xl text-gray-400 cursor-pointer" onclick="hideCameraView()"></i>
                <div class="flex-grow text-lg text-gray-200">Camera</div>
            </header>
            <main class="flex-grow flex flex-col items-center justify-between relative">
                <video id="camera-video" autoplay playsinline class="w-full h-full object-cover"></video>
                <button onclick="captureImage()" class="absolute bottom-10 w-16 h-16 bg-white rounded-full flex items-center justify-center active:bg-blue-500">
                    <i class="fas fa-camera text-black text-2xl"></i>
                </button>
            </main>
        </div>
        <div id="image-overlay" class="hidden fixed inset-0 overlay z-50 flex items-center justify-center p-4">
            <div class="max-w-4xl max-h-full relative">
                <img id="overlay-image" src="" alt="Full size image" class="max-w-full max-h-full rounded-2xl">
                <button class="absolute top-4 right-4 bg-black bg-opacity-50 text-white rounded-full w-10 h-10 flex items-center justify-content-center" onclick="hideImageOverlay()"><i class="fas fa-times"></i></button>
            </div>
        </div>
        <div id="media-overlay" class="hidden fixed inset-0 overlay z-50 flex items-center justify-center p-4">
            <div class="media-player-container">
                <div id="media-player-content"></div>
                <div class="media-player-controls">
                    <span class="media-play-btn"><i class="fas fa-play"></i></span>
                    <span class="media-pause-btn hidden"><i class="fas fa-pause"></i></span>
                    <input type="range" class="media-seek-bar" min="0" max="100" value="0">
                    <span class="media-time">0:00 / 0:00</span>
                </div>
                <button class="absolute top-4 right-4 bg-black bg-opacity-50 text-white rounded-full w-10 h-10 flex items-center justify-center" onclick="hideMediaOverlay()"><i class="fas fa-times"></i></button>
            </div>
        </div>
        <div id="news-overlay" class="hidden fixed inset-0 overlay z-50 flex items-end">
            <div class="bg-[#1E1F20] w-full h-3/4 rounded-t-3xl transform translate-y-full transition-transform duration-300" id="news-panel">
                <div class="p-6 h-full flex flex-col">
                    <div class="w-12 h-1 bg-gray-600 rounded-full mx-auto mb-6 flex-shrink-0"></div>
                    <h3 class="text-xl font-google-sans text-gray-200 mb-4 flex-shrink-0">Latest News</h3>
                    <div id="all-news-list" class="space-y-4 flex-grow overflow-y-auto"></div>
                    <button class="w-full mt-6 py-3 bg-gray-700 rounded-2xl text-gray-200 flex-shrink-0" onclick="hideNewsOverlay()">Close</button>
                </div>
            </div>
        </div>
        <div id="loading-overlay" class="hidden loading-overlay">
            <div class="ocr-spinner"></div>
            <div id="loading-progress" class="ocr-progress"></div>
        </div>
        <div id="notification-container"></div>
        <div id="fast-buttons" class="hidden fixed bottom-36 left-1/2 -translate-x-1/2 z-[100] flex flex-row space-x-4">
             <div class="fast-mode-btn" onclick="setFastMode('quick')" title="Quick Answer">
                <i class="fas fa-bolt text-white"></i>
                <span class="ml-2 font-medium">Quick</span>
            </div>
            <div class="fast-mode-btn" onclick="setFastMode('rocket')" title="Super Fast">
                <i class="fas fa-rocket text-white"></i>
                <span class="ml-2 font-medium">Rocket</span>
            </div>
        </div>
        <div class="bottom-bar transition-all">
            <div id="suggestions-container" class="w-full overflow-x-auto horizontal-scroll px-4 mb-2">
                <div class="flex space-x-3">
                    <div class="suggestion-chip p-4 rounded-2xl cursor-pointer flex-shrink-0 w-48" onclick="performSearch('Weather in Tokyo')">
                        <p class="text-gray-300">Weather in Tokyo</p>
                    </div>
                    <div class="suggestion-chip p-4 rounded-2xl cursor-pointer flex-shrink-0 w-48" onclick="performSearch('Solve 56^2 - 67^3')">
                        <p class="text-gray-300">Math problem</p>

                    typeAnimation(firstAnswerContainer, firstAnswerContent, () => {
                        renderAnswerExtras(0);
                        firstAnswerContainer.querySelectorAll('pre code').forEach(block => {
                            hljs.highlightElement(block);
                        });
                    });
                }
            }
            hljs.highlightAll()
        }

        function renderAnswerExtras(e) {
            answers[e]?.afterRender && answers[e].afterRender(e)
        }

        function renderError() {
            currentResponse = 'Sorry, something went wrong. Please try again.';
            const e = `error-response`;
            resultsContainer.innerHTML = `<p class="text-red-400 fade-in transition-all" id="main-response">${formatChatResponse(currentResponse,e)}</p>`, actionButtons.classList.remove('hidden'), hljs.highlightAll()
        }

        function truncateText(e, t) {
            return e ? e.length <= t ? e : e.substring(0, t - 3) + '...' : ''
        }

        function addToHistory(e) {
            searchHistory = searchHistory.filter(t => t.query !== e), searchHistory.unshift({
                id: Date.now(),
                query: e
            }), searchHistory.length > 50 && searchHistory.pop(), localStorage.setItem('araiSearchHistory', JSON.stringify(searchHistory))
        }

        function loadHistory() {
            renderHistoryList(searchHistory)
        }

        function renderHistoryList(e) {
            0 === e.length ? historyList.innerHTML = '<p class="text-gray-400 text-center py-8">No search history yet.</p>' : historyList.innerHTML = e.map(e => `<div class="history-item p-2 rounded-2xl flex items-center justify-between cursor-pointer hover:bg-gray-700 transition-colors" onclick="performSearch('${e.query.replace(/'/g,"\\'")}')"><p class="text-gray-200 truncate flex-1">${truncateText(e.query,80)}</p><button class="text-red-400 text-sm ml-2" onclick="deleteHistoryItem(${e.id});event.stopPropagation();">Delete</button></div>`).join('')
        }

        function deleteHistoryItem(e) {
            searchHistory = searchHistory.filter(t => t.id !== e), localStorage.setItem('araiSearchHistory', JSON.stringify(searchHistory)), renderHistoryList(searchHistory)
        }

        function clearHistory() {
            searchHistory = [], localStorage.setItem('araiSearchHistory', JSON.stringify(searchHistory)), renderHistoryList(searchHistory)
        }

        function showImageOverlay(e) {
            overlayImage.src = e, imageOverlay.classList.remove('hidden'), bottomBar.classList.add('bottom-bar-hidden')
        }

        function hideImageOverlay() {
            imageOverlay.classList.add('hidden'), overlayImage.src = '', ('home' === currentView || 'results' === currentView) && bottomBar.classList.remove('bottom-bar-hidden')
        }

        function showNewsOverlay() {
            allNewsList.innerHTML = currentNews.map(e => {
                const t = new Date(e.publishedAt).toLocaleDateString();
                return `<a href="${e.url}" target="_blank" class="news-item p-4 rounded-2xl flex space-x-4 hover:bg-gray-700 transition-colors"><div class="flex-1"><h3 class="text-gray-200 font-medium mb-2 truncate-3-lines">${truncateText(e.title,100)}</h3><p class="text-xs text-gray-500">${e.source.name} • ${t}</p></div>${e.urlToImage?`<img src="${e.urlToImage}" alt="News image" class="w-20 h-20 rounded-lg object-cover bg-gray-600" loading="lazy">`:''}</a>`
            }).join(''), newsOverlay.classList.remove('hidden'), newsPanel.classList.remove('translate-y-full'), bottomBar.classList.add('bottom-bar-hidden')
        }

        function hideNewsOverlay() {
            newsPanel.classList.add('translate-y-full'), setTimeout(() => {
                newsOverlay.classList.add('hidden')
            }, 300), ('home' === currentView || 'results' === currentView) && bottomBar.classList.remove('bottom-bar-hidden')
        }

        function showMediaOverlay(e, t, a) {
            mediaPlayer && (mediaPlayer.pause(), mediaPlayer.src = ''), mediaPlayerContent.innerHTML = '';
            const n = 'audio' === e ? document.createElement('audio') : document.createElement('video');
            n.src = t, n.className = 'w-full max-h-[80vh] rounded-t-2xl', mediaPlayerContent.appendChild(n), mediaOverlay.classList.remove('hidden'), mediaPlayer = n;
            const r = document.querySelector('.media-play-btn'),
                i = document.querySelector('.media-pause-btn'),
                o = document.querySelector('.media-seek-bar'),
                l = document.querySelector('.media-time');

            function c() {
                const e = Math.floor(n.currentTime),
                    t = Math.floor(n.duration || 0),
                    a = Math.floor(e / 60),
                    r = e % 60,
                    s = Math.floor(t / 60),
                    d = t % 60;
                l.textContent = `${a}:${r.toString().padStart(2,'0')} / ${s}:${d.toString().padStart(2,'0')}`, o.value = n.duration ? (n.currentTime / n.duration) * 100 : 0
            }
            n.addEventListener('timeupdate', c), n.addEventListener('loadedmetadata', c), r.addEventListener('click', () => {
                n.play(), r.classList.add('hidden'), i.classList.remove('hidden')
            }), i.addEventListener('click', () => {
                n.pause(), i.classList.add('hidden'), r.classList.remove('hidden')
            }), o.addEventListener('input', () => {
                const e = (o.value / 100) * n.duration;
                n.currentTime = e
            }), n.addEventListener('ended', () => {
                i.classList.add('hidden'), r.classList.remove('hidden')
            }), 'video' === e && (n.controls = !1), bottomBar.classList.add('bottom-bar-hidden')
        }

        function hideMediaOverlay() {
            mediaPlayer && (mediaPlayer.pause(), mediaPlayer.src = ''), mediaPlayer = null, mediaOverlay.classList.add('hidden'), mediaPlayerContent.innerHTML = '', ('home' === currentView || 'results' === currentView) && bottomBar.classList.remove('bottom-bar-hidden')
        }

        function shareResponse() {
            navigator.share ? navigator.share({
                title: 'Arai Search Result',
                text: currentResponse,
                url: window.location.href
            }).catch(e => console.error('Share error:', e)) : showNotification('Share not supported in this browser.')
        }

        function copyResponse() {
            navigator.clipboard.writeText(currentResponse).then(() => {
                showNotification('Response copied to clipboard!')
            }).catch(e => console.error('Copy error:', e))
        }

        function toggleTTS() {
            if (isSpeaking) speechSynthesis.cancel(), isSpeaking = !1, document.getElementById('tts-icon').classList.remove('tts-active');
            else {
                const e = new SpeechSynthesisUtterance(currentResponse);
                e.lang = detectLanguage(currentResponse) || 'en-US', speechSynthesis.speak(e), isSpeaking = !0, document.getElementById('tts-icon').classList.add('tts-active'), e.onend = () => {
                    isSpeaking = !1, document.getElementById('tts-icon').classList.remove('tts-active')
                }
            }
        }

        function prevAnswer() {
            currentAnswerIndex > 0 && (document.getElementById(`answer-${currentAnswerIndex}`).classList.add('hidden'), currentAnswerIndex--, document.getElementById(`answer-${currentAnswerIndex}`).classList.remove('hidden'), currentResponse = answers[currentAnswerIndex].plain, document.getElementById('pagination-span').textContent = `${currentAnswerIndex+1}/${answers.length}`, renderAnswerExtras(currentAnswerIndex))
        }

        function nextAnswer() {
            currentAnswerIndex < answers.length - 1 && (document.getElementById(`answer-${currentAnswerIndex}`).classList.add('hidden'), currentAnswerIndex++, document.getElementById(`answer-${currentAnswerIndex}`).classList.remove('hidden'), currentResponse = answers[currentAnswerIndex].plain, document.getElementById('pagination-span').textContent = `${currentAnswerIndex+1}/${answers.length}`, renderAnswerExtras(currentAnswerIndex))
        }

        function setFastMode(e) {
            isLoading = !1, clearInterval(loadingInterval), loadingSkeleton.classList.add('hidden'), fastButtons.classList.add('hidden'), logo.classList.remove('rotating'), resultsLogo.classList.remove('rotating'), bottomBar.classList.remove('opacity-50'), updateSendButtonState(), searchMode = e, performSearch(currentQuery, e)
        }

        function loadProfile() {
            usernameInput.value = username, profileUrlInput.value = profilePic, profilePicturePreview.src = profilePic, profileIcon.src = profilePic, translationLangInput.value = translationLang, helloMessage.textContent = username ? `Hello, ${username}!` : 'Hello!'
        }

        function saveProfile() {
            username = usernameInput.value.trim(), profilePic = profileUrlInput.value.trim() || 'https://placehold.co/32x32/333/FFF?text=U', translationLang = translationLangInput.value.trim() || 'default', localStorage.setItem('araiUsername', username), localStorage.setItem('araiProfilePic', profilePic), localStorage.setItem('araiTranslationLang', translationLang), profilePicturePreview.src = profilePic, profileIcon.src = profilePic, helloMessage.textContent = username ? `Hello, ${username}!` : 'Hello!', showNotification('Profile saved successfully!')
        }

        function handleProfileUpload(e) {
            const t = e.target.files[0];
            if (!t) return;
            t.size > 2097152 ? showNotification('Profile picture is too large. Please select a file smaller than 2MB.') : (reader = new FileReader, reader.onload = () => {
                profilePic = reader.result, profileUrlInput.value = '', localStorage.setItem('araiProfilePic', profilePic), profilePicturePreview.src = profilePic, profileIcon.src = profilePic, showNotification('Profile picture updated!')
            }, reader.readAsDataURL(t))
        }

        function filterHistory(e) {
            const t = searchHistory.filter(t => t.query.toLowerCase().includes(e.toLowerCase()));
            renderHistoryList(t)
        }

        function showNotification(e) {
            const t = document.createElement('div');
            t.className = 'notification', t.textContent = e, notificationContainer.appendChild(t), setTimeout(() => {
                t.remove()
            }, 3e3)
        }
        loadProfile();
    </script>
</body>
