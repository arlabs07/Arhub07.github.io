<!doctype html>
<html lang=en>

<head>
  <meta charset=UTF-8>
  <meta name=viewport
    content="width=device-width,initial-scale=1">
  <title>Web Code Editor</title>
  <link rel=stylesheet
    href=https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css>
  <link rel=stylesheet
    href=https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 95vh;
      display: flex;
      flex-direction: column
    }
    
    * {
      box-sizing: border-box
    }
    
    .main-container {
      display: flex;
      flex: 1;
      height: calc(95vh - 50px)
    }
    
    .editor-container {
      width: 50%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width .3s ease
    }
    
    .preview-container {
      width: 50%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width .3s ease
    }
    
    .editor-expanded {
      width: 100%
    }
    
    .preview-expanded {
      width: 100%
    }
    
    .editor-collapsed {
      width: 0
    }
    
    .preview-collapsed {
      width: 0
    }
    
    @media (max-width:768px) {
      .main-container {
        flex-direction: column
      }
      
      .editor-container {
        width: 100%;
        height: 50vh;
        transition: height .3s ease
      }
      
      .preview-container {
        width: 100%;
        height: 50vh;
        transition: height .3s ease
      }
      
      .editor-expanded {
        height: calc(95vh - 50px);
        width: 100%
      }
      
      .preview-expanded {
        height: calc(95vh - 50px);
        width: 100%
      }
      
      .editor-collapsed {
        height: 0;
        width: 100%
      }
      
      .preview-collapsed {
        height: 0;
        width: 100%
      }
    }
    
    .editor-content {
      flex-grow: 1;
      overflow: hidden
    }
    
    .preview-content {
      flex-grow: 1;
      overflow: auto;
      background-color: #fff
    }
    
    .nav-tabs {
      display: flex;
      background: #2d2d2d;
      padding: 0 10px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none
    }
    
    .nav-tabs::-webkit-scrollbar {
      display: none
    }
    
    .nav-tabs button {
      background: 0 0;
      border: none;
      color: #ccc;
      cursor: pointer;
      padding: 8px 15px;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      font-size: 14px;
      transition: all .3s
    }
    
    .nav-tabs button:hover {
      color: #66c0f4
    }
    
    .nav-tabs button.tab-active {
      color: #66c0f4;
      border-bottom-color: #66c0f4
    }
    
    .nav-tabs button.library-tab {
      color: #f59e0b;
      border-bottom-color: transparent
    }
    
    .nav-tabs button.library-tab:hover {
      color: #fbbf24
    }
    
    .nav-tabs button.library-tab.tab-active {
      color: #fbbf24;
      border-bottom-color: #fbbf24
    }
    
    .toolbar {
      display: flex;
      padding: 5px 10px;
      background-color: #1e1e1e;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      gap: 5px
    }
    
    .toolbar::-webkit-scrollbar {
      display: none
    }
    
    .toolbar button {
      background: 0 0;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
      padding: 6px 10px;
      border-radius: 3px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px
    }
    
    .toolbar button:hover {
      color: #66c0f4;
      background-color: #333
    }
    
    .preview-frame {
      width: 100%;
      height: 100%;
      border: none
    }
    
    .notification-bar {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      background: #1e1e1e;
      color: #fff;
      padding: 12px 24px;
      border-radius: 25px;
      border: 1px solid #66c0f4;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .5);
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: all .3s ease;
      font-size: 14px;
      max-width: 80%;
      text-align: center;
      top: 20px
    }
    
    .notification-bar.show {
      opacity: 1;
      visibility: visible
    }
    
    .notification-bar.success {
      border-color: #4ade80
    }
    
    .notification-bar.error {
      border-color: #ef4444
    }
    
    .notification-bar.info {
      border-color: #66c0f4
    }
    
    .console-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 35vh;
      background: #1e1e1e;
      border-top: 2px solid #66c0f4;
      transform: translateY(100%);
      transition: transform .3s ease;
      z-index: 1000;
      display: flex;
      flex-direction: column
    }
    
    .console-container.show {
      transform: translateY(0)
    }
    
    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 15px;
      background: #2d2d2d;
      border-bottom: 1px solid #444;
      flex-shrink: 0
    }
    
    .console-header-buttons {
      display: flex;
      gap: 15px
    }
    
    .console-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      color: #e0e0e0
    }
    
    .console-log {
      margin: 2px 0;
      padding: 4px 8px;
      border-radius: 3px;
      border-left: 3px solid transparent;
      word-break: break-all;
      line-height: 1.4
    }
    
    .console-log.log {
      border-left-color: #66c0f4
    }
    
    .console-log.error {
      background-color: #4a1a1a;
      color: #ff6b6b;
      border-left-color: #ff6b6b
    }
    
    .console-log.warn {
      background-color: #4a3d1a;
      color: #ffd93d;
      border-left-color: #ffd93d
    }
    
    .console-log.info {
      background-color: #1a1a4a;
      color: #6bb6ff;
      border-left-color: #6bb6ff
    }
    
    .console-log.network {
      background-color: #1a4a1a;
      color: #4ade80;
      border-left-color: #4ade80
    }
    
    .console-log .timestamp {
      color: #888;
      font-size: 10px;
      margin-right: 8px
    }
    
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, .8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: all .3s ease
    }
    
    .overlay.show {
      opacity: 1;
      visibility: visible
    }
    
    .overlay-form {
      background: #1e1e1e;
      color: #fff;
      padding: 30px;
      border-radius: 10px;
      border: 2px solid #66c0f4;
      max-width: 400px;
      width: 90%
    }
    
    .overlay-form h3 {
      margin: 0 0 20px 0;
      text-align: center;
      color: #66c0f4
    }
    
    .overlay-form .form-group {
      margin-bottom: 15px
    }
    
    .overlay-form label {
      display: block;
      margin-bottom: 5px;
      color: #ccc
    }
    
    .overlay-form input,
    select {
      width: 100%;
      padding: 8px;
      background: #2d2d2d;
      border: 1px solid #555;
      border-radius: 4px;
      color: #fff;
      font-size: 14px
    }
    
    .overlay-form .form-row {
      display: flex;
      gap: 10px
    }
    
    .overlay-form .form-row .form-group {
      flex: 1
    }
    
    .overlay-form .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px
    }
    
    .overlay-form button {
      padding: 8px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px
    }
    
    .overlay-form .btn-primary {
      background: #66c0f4;
      color: #fff
    }
    
    .overlay-form .btn-secondary {
      background: #555;
      color: #fff
    }
    
    .overlay-form button:hover {
      opacity: .8
    }
    
    .library-content {
      display: none;
      padding: 20px;
      background: #1e1e1e;
      height: calc(95vh - 50px);
      overflow-y: auto
    }
    
    .library-content.active {
      display: block
    }
    
    .library-item {
      background: #2d2d2d;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 5px;
      border: 1px solid #444;
      display: flex;
      justify-content: space-between;
      align-items: center
    }
    
    .library-item:hover {
      border-color: #66c0f4
    }
    
    .library-item-name {
      color: #66c0f4;
      cursor: pointer;
      font-size: 16px
    }
    
    .library-item-date {
      color: #888;
      font-size: 12px
    }
    
    .library-item-actions {
      display: flex;
      gap: 10px
    }
    
    .library-item button {
      background: 0 0;
      border: none;
      color: #ccc;
      cursor: pointer;
      padding: 5px;
      border-radius: 3px
    }
    
    .library-item button:hover {
      color: #66c0f4
    }
    
    .library-item button.delete:hover {
      color: #ef4444
    }
    
    .library-empty {
      text-align: center;
      color: #888;
      margin-top: 50px
    }
    
    @media (max-width:768px) {
      .toolbar button .btn-text {
        display: none
      }
      
      .console-container {
        height: 30vh
      }
      
      .console-header {
        padding: 6px 10px
      }
      
      .console-header-buttons {
        gap: 10px
      }
      
      .notification-bar {
        bottom: 10px;
        top: auto;
        padding: 8px 16px;
        font-size: 12px;
        max-width: 90%
      }
      
      .overlay-form {
        padding: 20px
      }
      
      .nav-tabs button {
        padding: 6px 12px;
        font-size: 13px
      }
      
      .library-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px
      }
      
      .library-item-actions {
        align-self: flex-end
      }
    }
  </style>
</head>

<body
  class="bg-gray-900 text-white font-mono">
  <div class=nav-tabs><button
      id=html-tab
      class="tab-active">HTML</button><button
      id=css-tab>CSS</button><button
      id=js-tab>JS</button><button
      id=readme-tab>README</button><button
      id=library-tab
      class=library-tab>
      Library</button></div>
  <div class=main-container>
    <div class=editor-container
      id=editor-container>
      <div class=editor-content>
        <div id=html-editor
          class=h-full></div>
        <div id=css-editor
          class="h-full hidden"></div>
        <div id=js-editor
          class="h-full hidden"></div>
        <div id=readme-editor
          class="h-full hidden"></div>
      </div>
      <div class=toolbar><button
          id=save-btn
          title="Save Project"><i
            class="fas fa-save"></i><span
            class=btn-text>Save</span></button><button
          id=erase-btn
          title="Erase Current Tab"><i
            class="fas fa-eraser"></i><span
            class=btn-text>Erase</span></button><button
          id=format-btn
          title="Format Code"><i
            class="fas fa-indent"></i><span
            class=btn-text>Format</span></button><button
          id=minify-btn
          title="Minify Code"><i
            class="fas fa-compress-arrows-alt"></i><span
            class=btn-text>Minify</span></button><button
          id=copy-btn
          title="Copy All Code"><i
            class="fas fa-copy"></i><span
            class=btn-text>Copy</span></button><button
          id=download-btn
          title="Download HTML File"><i
            class="fas fa-download"></i><span
            class=btn-text>Download</span></button><button
          id=download-container-btn
          title="Download Container"><i
            class="fas fa-cube"></i><span
            class=btn-text>Container</span></button><button
          id=console-btn
          title="Toggle Console"><i
            class="fas fa-terminal"></i><span
            class=btn-text>Console</span></button><button
          id=maximize-editor
          title="Maximize Editor"><i
            class="fas fa-expand"></i></button>
      </div>
    </div>
    <div class=preview-container
      id=preview-container>
      <div class=preview-content><iframe
          id=preview-frame
          class=preview-frame></iframe>
      </div>
      <div class=toolbar><button
          id=refresh-preview
          title="Refresh Preview"><i
            class="fas fa-sync-alt"></i><span
            class=btn-text>Refresh</span></button><button
          id=open-browser-btn
          title="Open in New Tab"><i
            class="fas fa-external-link-alt"></i><span
            class=btn-text>Open</span></button><button
          id=maximize-preview
          title="Maximize Preview"><i
            class="fas fa-expand"></i></button>
      </div>
    </div>
  </div>
  <div class=library-content
    id=library-content>
    <h2
      style="color:#66c0f4;margin-bottom:20px">
      Project Library</h2>
    <div id=library-list>
      <div class=library-empty>No saved
        projects yet. Click Save to
        create your first project!</div>
    </div>
  </div>
  <div id=notification-bar
    class=notification-bar></div>
  <div id=console-container
    class=console-container>
    <div class=console-header>
      <span>Console</span>
      <div class=console-header-buttons>
        <button id=console-clear
          title="Clear Console"><i
            class="fas fa-trash"></i></button><button
          id=console-close
          title="Close Console"><i
            class="fas fa-times"></i></button>
      </div>
    </div>
    <div class=console-content
      id=console-content></div>
  </div>
  <div id=save-overlay class=overlay>
    <div class=overlay-form>
      <h3>Save Project</h3>
      <div class=form-group>
        <label>Project
          Name</label><input type=text
          id=project-name
          placeholder="Enter project name...">
      </div>
      <div class=buttons><button
          class=btn-primary
          onclick=saveProject()>Save
          Project</button><button
          class=btn-secondary
          onclick=closeSaveOverlay()>Cancel</button>
      </div>
    </div>
  </div>
  <div id=dimension-overlay
    class=overlay>
    <div class=overlay-form>
      <h3>Container Dimensions</h3>
      <div class=form-row>
        <div class=form-group>
          <label>Width</label><input
            type=number
            id=container-width value=800
            min=300></div>
        <div class=form-group>
          <label>Unit</label><select
            id=width-unit>
            <option value=px>px</option>
            <option value=%>%</option>
            <option value=vw>vw</option>
            <option value=rem>rem
            </option>
          </select></div>
      </div>
      <div class=form-row>
        <div class=form-group>
          <label>Height</label><input
            type=number
            id=container-height
            value=600 min=300></div>
        <div class=form-group>
          <label>Unit</label><select
            id=height-unit>
            <option value=px>px</option>
            <option value=%>%</option>
            <option value=vh>vh</option>
            <option value=rem>rem
            </option>
          </select></div>
      </div>
      <div class=buttons><button
          class=btn-primary
          onclick=createContainer()>Create
          Container</button><button
          class=btn-secondary
          onclick=closeDimensionOverlay()>Cancel</button>
      </div>
    </div>
  </div>
  <script
    src=https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.33.0/min/vs/loader.min.js>
  </script>
  <script src="https://arlabs07.github.io/Arhub07.github.io/App/app16.js"></script>

</body>

</html>
